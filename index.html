<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PEA" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>PEA Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ─── DARK THEME (défaut) ─── */
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --gold-dim: rgba(201,168,76,0.15);
      --green: #3ecf8e;
      --green-dim: rgba(62,207,142,0.12);
      --text: #f0ede6;
      --text-muted: rgba(240,237,230,0.45);
      --text-dim: rgba(240,237,230,0.2);
      --danger: #ff5c5c;
      --shadow: rgba(0,0,0,0.3);
      --radius: 16px;
    }

    /* ─── LIGHT THEME ─── */
    html.light {
      --bg: #f5f2ec;
      --surface: #ffffff;
      --surface2: #ede9e1;
      --border: rgba(0,0,0,0.08);
      --gold: #a07828;
      --gold-light: #b8892e;
      --gold-dim: rgba(160,120,40,0.1);
      --green: #1a9e6a;
      --green-dim: rgba(26,158,106,0.1);
      --text: #1a1612;
      --text-muted: rgba(26,22,18,0.5);
      --text-dim: rgba(26,22,18,0.25);
      --danger: #d93c3c;
      --shadow: rgba(0,0,0,0.08);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overscroll-behavior: none;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER ─── */
    .header {
      padding: 20px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-date {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }
    .theme-toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s, border-color 0.3s;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .theme-toggle:active { opacity: 0.7; }

    /* ─── MAIN SCROLL ─── */
    .scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ─── HERO CARD ─── */
    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 12px var(--shadow);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .hero-amount {
      font-family: 'DM Mono', monospace;
      font-size: 42px;
      font-weight: 500;
      color: var(--gold-light);
      line-height: 1;
      letter-spacing: -1px;
      margin-bottom: 4px;
    }
    .hero-amount span {
      font-size: 22px;
      opacity: 0.6;
    }
    .hero-sub {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .hero-sub b {
      color: var(--green);
      font-weight: 400;
    }

    /* Progress bar */
    .progress-track {
      height: 6px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 50%;
      transform: translateY(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 8px var(--gold);
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
    }
    .progress-pct {
      font-weight: 500;
      color: var(--gold);
    }

    /* ─── STATS ROW ─── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 2px 8px var(--shadow);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .stat-card.highlight {
      border-color: rgba(62,207,142,0.25);
      background: linear-gradient(135deg, var(--surface), rgba(62,207,142,0.04));
    }
    .stat-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      line-height: 1;
    }
    .stat-value.green { color: var(--green); }
    .stat-value.gold { color: var(--gold-light); }
    .stat-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* ─── ESTIMATION CARD ─── */
    .est-card {
      background: var(--surface);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .est-icon {
      font-size: 28px;
      flex-shrink: 0;
    }
    .est-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .est-date {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      color: var(--gold-light);
      font-weight: 500;
    }
    .est-detail {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ─── SECTION TITLE ─── */
    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ─── HISTORY LIST ─── */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .history-left { display: flex; flex-direction: column; gap: 3px; }
    .history-date {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }
    .history-note {
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
    }
    .history-amount {
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: var(--green);
    }
    .history-delete {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      margin-left: 10px;
    }
    .history-delete:active { color: var(--danger); background: rgba(255,92,92,0.1); }
    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }

    /* ─── BOTTOM SHEET ─── */
    .fab {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
    }
    .btn-add {
      background: var(--gold);
      color: #0a0a0f;
      border: none;
      border-radius: 40px;
      padding: 16px 28px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(201,168,76,0.4);
      transition: all 0.2s;
    }
    .btn-add:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(201,168,76,0.3); }

    .btn-settings {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 16px 18px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-settings:active { background: var(--surface); }

    /* ─── MODAL ─── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }
    .overlay.open { display: flex; }
    .modal {
      width: 100%;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 12px 24px calc(32px + env(safe-area-inset-bottom));
      animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
      transition: background 0.3s;
      box-shadow: 0 -4px 30px var(--shadow);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .modal-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 99px;
      margin: 0 auto 20px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .field input:focus { border-color: var(--gold); }
    .modal-btns {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
      margin-top: 8px;
    }
    .btn-cancel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: var(--text-muted);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-confirm {
      background: var(--gold);
      border: none;
      border-radius: 12px;
      padding: 16px;
      color: #0a0a0f;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-cancel:active { opacity: 0.7; }
    .btn-confirm:active { opacity: 0.85; }

    /* ─── SETTINGS MODAL ─── */
    .settings-info {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .danger-zone {
      margin-top: 8px;
      padding: 14px 16px;
      background: rgba(255,92,92,0.06);
      border: 1px solid rgba(255,92,92,0.2);
      border-radius: 12px;
    }
    .danger-zone-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--danger);
      margin-bottom: 10px;
    }
    .btn-danger {
      background: none;
      border: 1px solid rgba(255,92,92,0.3);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--danger);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn-danger:active { background: rgba(255,92,92,0.1); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-logo">▲ PEA Tracker</div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span>
        <span id="themeLabel">Clair</span>
      </button>
      <div class="header-date" id="headerDate"></div>
    </div>
  </div>

  <div class="scroll">
    <!-- HERO -->
    <div class="hero">
      <div class="hero-label">Total versé</div>
      <div class="hero-amount"><span>€</span><span id="heroAmount">0</span></div>
      <div class="hero-sub">Reste <b id="heroRemain">150 000</b> € pour atteindre le plafond</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-labels">
        <span>0 €</span>
        <span class="progress-pct" id="progressPct">0%</span>
        <span>150 000 €</span>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Versements</div>
        <div class="stat-value" id="statCount">0</div>
        <div class="stat-sub">opérations</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-label">Moy. mensuelle</div>
        <div class="stat-value green" id="statAvg">—</div>
        <div class="stat-sub">sur <span id="statMonths">0</span> mois</div>
      </div>
    </div>

    <!-- ESTIMATION -->
    <div class="est-card">
      <div class="est-icon">🎯</div>
      <div>
        <div class="est-label">Plafond 150k€ estimé</div>
        <div class="est-date" id="estDate">Configurer →</div>
        <div class="est-detail" id="estDetail">Ajouter un versement mensuel estimé</div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="section-title">Historique</div>
    <div class="history-list" id="historyList">
      <div class="empty-state">Aucun versement enregistré</div>
    </div>
  </div>

  <!-- FAB -->
  <div class="fab">
    <button class="btn-settings" onclick="openSettings()">⚙️</button>
    <button class="btn-add" onclick="openAdd()">+ Ajouter un versement</button>
  </div>

  <!-- ADD MODAL -->
  <div class="overlay" id="addOverlay" onclick="closeOverlay(event, 'addOverlay')">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Nouveau versement</div>
      <div class="field">
        <label>Montant (€)</label>
        <input type="number" id="inputAmount" inputmode="decimal" placeholder="1 000" min="0" />
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="inputDate" />
      </div>
      <div class="field">
        <label>Note (optionnel)</label>
        <input type="text" id="inputNote" placeholder="Épargne mensuelle…" maxlength="40" />
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('addOverlay')">Annuler</button>
        <button class="btn-confirm" onclick="addVersement()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="overlay" id="settingsOverlay" onclick="closeOverlay(event, 'settingsOverlay')">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Paramètres</div>
      <div class="field">
        <label>Solde de départ (€)</label>
        <input type="number" id="inputSoldeDepart" inputmode="decimal" placeholder="50 000" min="0" />
      </div>
      <div class="field">
        <label>Versement mensuel estimé (€)</label>
        <input type="number" id="inputMonthly" inputmode="decimal" placeholder="500" min="0" />
      </div>
      <div class="settings-info" id="settingsInfo"></div>
      <div class="danger-zone">
        <div class="danger-zone-title">⚠ Zone danger</div>
        <button class="btn-danger" onclick="resetData()">Effacer toutes les données</button>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('settingsOverlay')">Annuler</button>
        <button class="btn-confirm" onclick="saveSettings()">Sauvegarder</button>
      </div>
    </div>
  </div>

  <script>
    // ── THEME ──
    function applyTheme(theme) {
      if (theme === 'light') {
        document.documentElement.classList.add('light');
        document.getElementById('themeIcon').textContent = '🌙';
        document.getElementById('themeLabel').textContent = 'Sombre';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f2ec');
      } else {
        document.documentElement.classList.remove('light');
        document.getElementById('themeIcon').textContent = '☀️';
        document.getElementById('themeLabel').textContent = 'Clair';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0f');
      }
    }

    function toggleTheme() {
      const isLight = document.documentElement.classList.contains('light');
      const newTheme = isLight ? 'dark' : 'light';
      data.theme = newTheme;
      save(data);
      applyTheme(newTheme);
    }

    // ── STORAGE ──
    const STORAGE_KEY = 'pea_data_v2';

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
    }
    function save(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let data = load();
    if (!data.versements) data.versements = [];
    if (!data.soldeDepart) data.soldeDepart = 0;
    if (!data.monthly) data.monthly = 0;
    if (!data.theme) data.theme = 'dark';

    // Appliquer le thème dès le démarrage
    applyTheme(data.theme);

    // ── FORMATTERS ──
    const fmtEur = v => new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v);
    const fmtDate = d => new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
    const fmtMonth = d => new Date(d).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    const today = () => new Date().toISOString().slice(0, 10);

    // ── RENDER ──
    function render() {
      const MAX = 150000;
      const total = data.soldeDepart + data.versements.reduce((s, v) => s + v.amount, 0);
      const remain = Math.max(0, MAX - total);
      const pct = Math.min(100, (total / MAX) * 100);

      // Header date
      document.getElementById('headerDate').textContent =
        new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });

      // Hero
      document.getElementById('heroAmount').textContent = fmtEur(total);
      document.getElementById('heroRemain').textContent = fmtEur(remain);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressPct').textContent = pct.toFixed(1) + '%';

      // Stats
      const n = data.versements.length;
      document.getElementById('statCount').textContent = n;

      let avgText = '—', months = 0;
      if (n > 0) {
        const sum = data.versements.reduce((s, v) => s + v.amount, 0);
        // Compute months range
        const dates = data.versements.map(v => new Date(v.date));
        const minD = new Date(Math.min(...dates));
        const maxD = new Date(Math.max(...dates));
        months = Math.max(1, Math.round((maxD - minD) / (1000 * 60 * 60 * 24 * 30.4)) + 1);
        const avg = sum / months;
        avgText = fmtEur(avg) + ' €';
        document.getElementById('statMonths').textContent = months;
      }
      document.getElementById('statAvg').textContent = avgText;

      // Estimation
      const monthly = data.monthly;
      if (remain <= 0) {
        document.getElementById('estDate').textContent = '🎉 Plafond atteint !';
        document.getElementById('estDetail').textContent = 'Félicitations, ton PEA est plein.';
      } else if (monthly > 0) {
        const monthsLeft = Math.ceil(remain / monthly);
        const target = new Date();
        target.setMonth(target.getMonth() + monthsLeft);
        const targetStr = target.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        document.getElementById('estDate').textContent = targetStr;
        document.getElementById('estDetail').textContent =
          `Dans ${monthsLeft} mois · ${fmtEur(monthly)} €/mois estimé`;
      } else {
        document.getElementById('estDate').textContent = 'Non configuré';
        document.getElementById('estDetail').textContent = 'Configurer un versement mensuel estimé ↗';
      }

      // History
      const list = document.getElementById('historyList');
      if (data.versements.length === 0) {
        list.innerHTML = '<div class="empty-state">Aucun versement enregistré</div>';
      } else {
        const sorted = [...data.versements].sort((a, b) => b.date.localeCompare(a.date));
        list.innerHTML = sorted.map(v => `
          <div class="history-item">
            <div class="history-left">
              <div class="history-date">${fmtDate(v.date)}</div>
              ${v.note ? `<div class="history-note">${v.note}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:0">
              <div class="history-amount">+${fmtEur(v.amount)} €</div>
              <button class="history-delete" onclick="deleteVersement('${v.id}')">✕</button>
            </div>
          </div>
        `).join('');
      }
    }

    // ── ADD ──
    function openAdd() {
      document.getElementById('inputDate').value = today();
      document.getElementById('inputAmount').value = '';
      document.getElementById('inputNote').value = '';
      document.getElementById('addOverlay').classList.add('open');
      setTimeout(() => document.getElementById('inputAmount').focus(), 400);
    }

    function addVersement() {
      const amount = parseFloat(document.getElementById('inputAmount').value);
      const date = document.getElementById('inputDate').value;
      const note = document.getElementById('inputNote').value.trim();
      if (!amount || amount <= 0 || !date) return;

      data.versements.push({
        id: Date.now().toString(),
        amount, date, note
      });
      save(data);
      closeModal('addOverlay');
      render();
    }

    function deleteVersement(id) {
      if (!confirm('Supprimer ce versement ?')) return;
      data.versements = data.versements.filter(v => v.id !== id);
      save(data);
      render();
    }

    // ── SETTINGS ──
    function openSettings() {
      document.getElementById('inputSoldeDepart').value = data.soldeDepart || '';
      document.getElementById('inputMonthly').value = data.monthly || '';

      // Info
      const info = data.soldeDepart
        ? `Solde de départ actuel : ${fmtEur(data.soldeDepart)} €\nVersement mensuel estimé : ${data.monthly ? fmtEur(data.monthly) + ' €' : 'Non défini'}`
        : '';
      document.getElementById('settingsInfo').textContent = info;

      document.getElementById('settingsOverlay').classList.add('open');
    }

    function saveSettings() {
      const sd = parseFloat(document.getElementById('inputSoldeDepart').value) || 0;
      const m = parseFloat(document.getElementById('inputMonthly').value) || 0;
      data.soldeDepart = sd;
      data.monthly = m;
      save(data);
      closeModal('settingsOverlay');
      render();
    }

    function resetData() {
      if (!confirm('Effacer TOUTES les données ? Cette action est irréversible.')) return;
      data = { versements: [], soldeDepart: 0, monthly: 0 };
      save(data);
      closeModal('settingsOverlay');
      render();
    }

    // ── MODALS ──
    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }
    function closeOverlay(e, id) {
      if (e.target === document.getElementById(id)) closeModal(id);
    }

    // Close on ESC
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal('addOverlay');
        closeModal('settingsOverlay');
      }
    });

    // Enter to confirm
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('addOverlay').classList.contains('open')) addVersement();
        if (document.getElementById('settingsOverlay').classList.contains('open')) saveSettings();
      }
    });

    // ── INIT ──
    render();
  </script>
</body>
</html>
